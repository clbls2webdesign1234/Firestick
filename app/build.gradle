plugins {
    id 'com.android.application'
}

// Each GitHub build gets a higher number, so a new APK installs over the old one.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'com.discshelf.tv'
    compileSdk 36

    defaultConfig {
        applicationId 'com.discshelf.tv'
        // 22 is Fire OS 5, on the older Fire TV Sticks.
        minSdk 22
        // 29 keeps plain file access to USB drives working on Fire OS 8.
        targetSdk 29
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
        ndk {
            // Fire TV devices are ARM; leaving out x86 halves the APK size.
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            // A fixed key, so every build can update the one already on the stick.
            storeFile rootProject.file('signing/discshelf.jks')
            storeType 'pkcs12'
            storePassword 'discshelf'
            keyAlias 'discshelf'
            keyPassword 'discshelf'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            // Duplicates inside the share library's encryption package.
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES',
                         'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA']
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // The VLC playback engine: reads DVD and Blu-ray images, menus included.
    implementation 'org.videolan.android:libvlc-all:3.6.2'
    // Reads cover pictures saved beside the discs on a network share.
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'
}
